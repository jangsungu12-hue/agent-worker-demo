<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="panel auth-panel" id="auth-panel">
      <p class="eyebrow">Demo Access</p>
      <h1>Login</h1>
      <p class="description">
        Sign in with the demo account before using the calculator.
      </p>

      <div class="credential-hint">
        <p>Test account</p>
        <code>demo@demo.com / password123</code>
      </div>

      <form id="login-form" class="stack-form">
        <label class="field">
          <span>Email</span>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="demo@demo.com">
        </label>

        <label class="field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="password123">
        </label>

        <button type="submit">Log In</button>
      </form>

      <p id="auth-message" class="status-message" aria-live="polite"></p>
    </section>

    <section class="panel app-panel hidden" id="app-panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Arithmetic Calculator</p>
          <h1>Calculator</h1>
        </div>
        <button type="button" id="logout-button" class="secondary-button">Log Out</button>
      </div>

      <p class="description">
        Enter two numbers and an operator to calculate instantly after login.
      </p>

      <p id="welcome-message" class="welcome-message"></p>

      <form id="calculator-form" class="stack-form">
        <label class="field">
          <span>First number</span>
          <input id="first-number" name="firstNumber" type="number" step="any" placeholder="e.g. 12">
        </label>

        <label class="field">
          <span>Operator</span>
          <select id="operator" name="operator">
            <option value="+">Add (+)</option>
            <option value="-">Subtract (-)</option>
            <option value="*">Multiply (x)</option>
            <option value="/">Divide (/)</option>
          </select>
        </label>

        <label class="field">
          <span>Second number</span>
          <input id="second-number" name="secondNumber" type="number" step="any" placeholder="e.g. 3">
        </label>

        <button type="submit">Calculate</button>
      </form>

      <section class="result-box" aria-live="polite">
        <p class="result-label">Result</p>
        <p id="result" class="result-value">Enter values to begin.</p>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
