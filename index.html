<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell" aria-labelledby="app-title">
    <section class="calculator" aria-label="Four function calculator">
      <header class="calculator-header">
        <p class="eyebrow">Calculator</p>
        <h1 id="app-title">Four operations</h1>
      </header>

      <section class="display" aria-live="polite">
        <div class="display-label">Expression</div>
        <output id="expression" class="expression" aria-label="Current expression">0</output>
        <div class="display-label">Result</div>
        <output id="result" class="result" aria-label="Calculated result">Press =</output>
      </section>

      <section class="keypad" aria-label="Calculator keys">
        <button type="button" class="key key-secondary" data-action="clear">C</button>
        <button type="button" class="key key-secondary" data-action="backspace">DEL</button>
        <button type="button" class="key key-secondary" data-action="decimal">.</button>
        <button type="button" class="key key-operator" data-operator="/">/</button>

        <button type="button" class="key" data-number="7">7</button>
        <button type="button" class="key" data-number="8">8</button>
        <button type="button" class="key" data-number="9">9</button>
        <button type="button" class="key key-operator" data-operator="*">*</button>

        <button type="button" class="key" data-number="4">4</button>
        <button type="button" class="key" data-number="5">5</button>
        <button type="button" class="key" data-number="6">6</button>
        <button type="button" class="key key-operator" data-operator="-">-</button>

        <button type="button" class="key" data-number="1">1</button>
        <button type="button" class="key" data-number="2">2</button>
        <button type="button" class="key" data-number="3">3</button>
        <button type="button" class="key key-operator" data-operator="+">+</button>

        <button type="button" class="key key-zero" data-number="0">0</button>
        <button type="button" class="key key-equals" data-action="equals">=</button>
      </section>
    </section>
  </main>
</body>
</html>
