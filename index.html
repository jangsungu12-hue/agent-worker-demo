<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="login-panel" aria-labelledby="login-title">
      <header class="login-header">
        <p class="eyebrow">Secure Access</p>
        <h1 id="login-title">로그인</h1>
        <p class="subtitle">다시 만나서 반가워요.</p>
      </header>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="email">이메일</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="name@example.com"
            aria-describedby="email-error"
            required
          >
          <p id="email-error" class="field-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            aria-describedby="password-error"
            required
          >
          <p id="password-error" class="field-error" aria-live="polite"></p>
        </div>

        <div class="form-options">
          <label class="checkbox-row">
            <input id="remember" name="remember" type="checkbox">
            <span>로그인 유지</span>
          </label>
        </div>

        <button type="submit" class="submit-button">로그인</button>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
