<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell" aria-labelledby="login-title">
    <section id="login-screen" class="login-panel" aria-labelledby="login-title">
      <header class="login-header">
        <p class="eyebrow">Login</p>
        <h1 id="login-title">로그인</h1>
      </header>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="username">아이디</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <p id="login-error" class="form-error" aria-live="polite"></p>
        <button type="submit" class="login-button">로그인</button>
      </form>
    </section>

    <section id="welcome-screen" class="login-panel" aria-labelledby="welcome-title" hidden>
      <header class="login-header">
        <p class="eyebrow">Welcome</p>
        <h1 id="welcome-title">환영합니다</h1>
      </header>
      <p id="welcome-message" class="welcome-message"></p>
      <button type="button" id="logout-button" class="login-button">로그아웃</button>
    </section>
  </main>
</body>
</html>
