<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계산기</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell" aria-labelledby="login-title">
    <section id="login-screen" class="login-panel" aria-labelledby="login-title">
      <header class="login-header">
        <p class="eyebrow">Login</p>
        <h1 id="login-title">로그인</h1>
      </header>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="username">아이디</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <p id="login-error" class="form-error" aria-live="polite"></p>
        <button type="submit" class="login-button">로그인</button>
      </form>
    </section>

    <section id="calc-screen" class="calc-panel" aria-labelledby="calc-title" hidden>
      <header class="login-header">
        <p class="eyebrow">Calculator</p>
        <h1 id="calc-title">계산기</h1>
      </header>

      <div class="calc-display" aria-live="polite" aria-atomic="true">
        <div class="calc-expr" id="calc-expr"></div>
        <div class="calc-result" id="calc-result">0</div>
      </div>

      <div class="calc-grid" role="group" aria-label="계산기 버튼">
        <button class="calc-btn btn-clear"  data-action="clear">C</button>
        <button class="calc-btn btn-func"   data-action="backspace">←</button>
        <button class="calc-btn btn-op"     data-value="/">÷</button>

        <button class="calc-btn btn-paren"  data-value="(">(</button>
        <button class="calc-btn btn-paren"  data-value=")">)</button>
        <button class="calc-btn btn-num"    data-value=".">.</button>
        <button class="calc-btn btn-op"     data-value="*">×</button>

        <button class="calc-btn btn-num"    data-value="7">7</button>
        <button class="calc-btn btn-num"    data-value="8">8</button>
        <button class="calc-btn btn-num"    data-value="9">9</button>
        <button class="calc-btn btn-op"     data-value="-">−</button>

        <button class="calc-btn btn-num"    data-value="4">4</button>
        <button class="calc-btn btn-num"    data-value="5">5</button>
        <button class="calc-btn btn-num"    data-value="6">6</button>
        <button class="calc-btn btn-op"     data-value="+">+</button>

        <button class="calc-btn btn-num"    data-value="1">1</button>
        <button class="calc-btn btn-num"    data-value="2">2</button>
        <button class="calc-btn btn-num"    data-value="3">3</button>
        <button class="calc-btn btn-equals" data-action="equals">=</button>

        <button class="calc-btn btn-num btn-zero" data-value="0">0</button>
      </div>

      <button type="button" id="logout-button" class="login-button calc-logout">로그아웃</button>
    </section>
  </main>
</body>
</html>
