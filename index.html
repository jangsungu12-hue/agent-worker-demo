<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사칙연산 계산기</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="login-screen" class="app-shell" aria-labelledby="login-title">
    <section class="login-panel" aria-labelledby="login-title">
      <header class="login-header">
        <p class="eyebrow">Login</p>
        <h1 id="login-title">로그인</h1>
      </header>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="username">아이디</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <p id="login-error" class="form-error" aria-live="polite"></p>
        <button type="submit" class="login-button">로그인</button>
      </form>
    </section>
  </main>

  <div id="calculator-screen" class="calc-wrapper" hidden>
    <div class="calc" role="application" aria-label="사칙연산 계산기">
      <div class="calc-display">
        <div class="calc-expression" id="calc-expression" aria-hidden="true"></div>
        <output class="calc-result" id="calc-result" aria-live="polite" aria-atomic="true">0</output>
      </div>
      <div class="calc-buttons">
        <button class="calc-btn calc-btn--action" data-action="clear">AC</button>
        <button class="calc-btn calc-btn--action" data-action="sign">+/-</button>
        <button class="calc-btn calc-btn--action" data-action="percent">%</button>
        <button class="calc-btn calc-btn--op" data-op="÷">÷</button>

        <button class="calc-btn" data-num="7">7</button>
        <button class="calc-btn" data-num="8">8</button>
        <button class="calc-btn" data-num="9">9</button>
        <button class="calc-btn calc-btn--op" data-op="×">×</button>

        <button class="calc-btn" data-num="4">4</button>
        <button class="calc-btn" data-num="5">5</button>
        <button class="calc-btn" data-num="6">6</button>
        <button class="calc-btn calc-btn--op" data-op="-">-</button>

        <button class="calc-btn" data-num="1">1</button>
        <button class="calc-btn" data-num="2">2</button>
        <button class="calc-btn" data-num="3">3</button>
        <button class="calc-btn calc-btn--op" data-op="+">+</button>

        <button class="calc-btn calc-btn--zero" data-num="0">0</button>
        <button class="calc-btn" data-action="decimal">.</button>
        <button class="calc-btn calc-btn--op" data-action="equals">=</button>
      </div>
    </div>
    <button type="button" id="logout-button" class="logout-link">로그아웃</button>
  </div>
</body>
</html>
